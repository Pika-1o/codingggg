<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfectly Normal Beach</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;

  background: linear-gradient(
    90deg,
    #c7b58a 0%,
    #d8c79b 38%,
    #91d2df 62%,
    #3fa6c5 100%
  );
}

/* =========================
   WARNING TEXT
========================= */

.wave-warning {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);

  color: white;
  font-family: "Comic Sans MS", "Comic Sans", cursive;
  font-size: 25px;
  font-weight: bold;
  text-align: center;

  z-index: 50;

  text-shadow:
    2px 2px 4px rgba(0, 0, 0, 0.4);
}

.wave-warning span {
  font-size: 17px;
  font-weight: normal;
}

/* =========================
   BEACH DECORATIONS
========================= */

.palm {
  position: absolute;
  left: 2%;
  bottom: -5px;
  font-size: 145px;
  z-index: 5;
}

.umbrella {
  position: absolute;
  left: 23%;
  bottom: 7%;
  font-size: 85px;
  z-index: 5;
}

.castle {
  position: absolute;
  left: 16%;
  bottom: 3%;
  font-size: 65px;
  z-index: 5;
}

.shell {
  position: absolute;
  z-index: 5;
}

.shell1 {
  left: 11%;
  bottom: 27%;
  font-size: 35px;
  transform: rotate(-20deg);
}

.shell2 {
  left: 31%;
  bottom: 31%;
  font-size: 28px;
  transform: rotate(25deg);
}

.shell3 {
  left: 14%;
  bottom: 10%;
  font-size: 22px;
  transform: rotate(40deg);
}

.starfish {
  position: absolute;
  left: 34%;
  bottom: 14%;
  font-size: 38px;
  z-index: 5;
  transform: rotate(20deg);
}

.ball {
  position: absolute;
  left: 34%;
  bottom: 42%;
  font-size: 45px;
  z-index: 5;

  animation: bounce 3s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }

  50% {
    transform: translateY(-20px) rotate(180deg);
  }
}

/* =========================
   CRABS
========================= */

.crab {
  position: absolute;
  z-index: 10;
  pointer-events: none;
}

.small {
  font-size: 24px;
}

.medium {
  font-size: 40px;
}

.large {
  font-size: 60px;
}

.crab1 {
  animation: crab1 9s infinite alternate ease-in-out;
}

.crab2 {
  animation: crab2 12s infinite alternate ease-in-out;
}

.crab3 {
  animation: crab3 10s infinite alternate ease-in-out;
}

.crab4 {
  animation: crab4 15s infinite alternate ease-in-out;
}

.crab5 {
  animation: crab5 11s infinite alternate ease-in-out;
}

.crab6 {
  animation: crab6 14s infinite alternate ease-in-out;
}

.crab7 {
  animation: crab7 8s infinite alternate ease-in-out;
}

.crab8 {
  animation: crab8 13s infinite alternate ease-in-out;
}

@keyframes crab1 {
  0% {
    left: 4%;
    top: 75%;
    transform: rotate(-10deg);
  }

  100% {
    left: 29%;
    top: 67%;
    transform: scaleX(-1) rotate(10deg);
  }
}

@keyframes crab2 {
  0% {
    left: 30%;
    top: 22%;
  }

  100% {
    left: 8%;
    top: 34%;
    transform: scaleX(-1) rotate(-15deg);
  }
}

@keyframes crab3 {
  0% {
    left: 6%;
    top: 48%;
  }

  100% {
    left: 26%;
    top: 57%;
    transform: scaleX(-1) rotate(15deg);
  }
}

@keyframes crab4 {
  0% {
    left: 33%;
    top: 82%;
  }

  100% {
    left: 8%;
    top: 76%;
    transform: scaleX(-1);
  }
}

@keyframes crab5 {
  0% {
    left: 7%;
    top: 14%;
  }

  100% {
    left: 34%;
    top: 20%;
    transform: scaleX(-1) rotate(20deg);
  }
}

@keyframes crab6 {
  0% {
    left: 34%;
    top: 55%;
  }

  100% {
    left: 12%;
    top: 63%;
    transform: rotate(-20deg);
  }
}

@keyframes crab7 {
  0% {
    left: 10%;
    top: 38%;
  }

  100% {
    left: 31%;
    top: 45%;
    transform: scaleX(-1);
  }
}

@keyframes crab8 {
  0% {
    left: 24%;
    top: 7%;
  }

  100% {
    left: 5%;
    top: 18%;
    transform: rotate(-15deg);
  }
}

/* =========================
   OCEAN
========================= */

.ocean {
  position: absolute;
  right: 0;
  top: 0;

  width: 62%;
  height: 100%;

  overflow: hidden;
}

/* Fish */

.fish {
  position: absolute;
  font-size: 45px;
  opacity: 0.7;

  animation: swim 8s ease-in-out infinite;
}

.fish1 {
  left: 15%;
  top: 25%;
}

.fish2 {
  left: 70%;
  top: 68%;
  animation-delay: 3s;
}

@keyframes swim {
  0% {
    transform: translateX(0);
  }

  50% {
    transform: translateX(120px) scaleX(-1);
  }

  100% {
    transform: translateX(0);
  }
}

/* Seaweed */

.seaweed {
  position: absolute;
  bottom: -15px;
  font-size: 75px;
  opacity: 0.65;
}

.seaweed1 {
  left: 8%;
}

.seaweed2 {
  left: 75%;
  font-size: 95px;
}

.seaweed3 {
  left: 45%;
  font-size: 55px;
}

/* =========================
   WAVE
========================= */

.wave-link {
  position: absolute;

  left: 50%;
  top: 52%;

  transform:
    translate(-50%, -50%)
    scaleX(-1);

  text-decoration: none;

  z-index: 20;
}

.wave {
  display: block;

  font-size: 190px;

  filter: drop-shadow(
    0 15px 10px rgba(0, 70, 100, 0.25)
  );

  transition: transform 0.25s ease;
}

.wave-link:hover .wave {
  transform: scale(1.1) rotate(-4deg);
}

.wave-link:active .wave {
  transform: scale(0.95);
}

/* =========================
   BUBBLES
========================= */

.bubble {
  position: absolute;

  color: rgba(255,255,255,0.5);

  animation: floatUp linear infinite;
}

.bubble1 {
  left: 15%;
  bottom: -20px;
  font-size: 25px;
  animation-duration: 8s;
}

.bubble2 {
  left: 40%;
  bottom: -30px;
  font-size: 18px;
  animation-duration: 11s;
}

.bubble3 {
  left: 70%;
  bottom: -20px;
  font-size: 30px;
  animation-duration: 9s;
}

@keyframes floatUp {

  from {
    transform: translateY(0);
    opacity: 0;
  }

  20% {
    opacity: 0.7;
  }

  to {
    transform: translateY(-100vh);
    opacity: 0;
  }
}

/* =========================
   HIDDEN CRAB RAVE
========================= */

#music {
  position: fixed;

  width: 1px;
  height: 1px;

  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- WARNING -->

<div class="wave-warning">
  Don't ride on the waves<br>
  <span>(don't click on the wave lil dawg)</span>
</div>


<!-- BEACH -->

<div class="palm">🌴</div>

<div class="umbrella">🏖️</div>

<div class="castle">🏰</div>

<div class="shell shell1">🐚</div>
<div class="shell shell2">🐚</div>
<div class="shell shell3">🐚</div>

<div class="starfish">⭐</div>

<div class="ball">🏐</div>


<!-- CRABS -->

<div class="crab crab1 medium">🦀</div>
<div class="crab crab2 small">🦀</div>
<div class="crab crab3 large">🦀</div>
<div class="crab crab4 medium">🦀</div>
<div class="crab crab5 large">🦀</div>
<div class="crab crab6 small">🦀</div>
<div class="crab crab7 medium">🦀</div>
<div class="crab crab8 small">🦀</div>


<!-- OCEAN -->

<div class="ocean">

  <div class="fish fish1">🐟</div>

  <div class="fish fish2">🐠</div>

  <div class="seaweed seaweed1">🌿</div>

  <div class="seaweed seaweed2">🌿</div>

  <div class="seaweed seaweed3">🌿</div>


  <!-- SECRET WAVE -->

  <a
    class="wave-link"
    href="death.html"
  >
    <span class="wave">🌊</span>
  </a>


  <!-- BUBBLES -->

  <div class="bubble bubble1">○</div>

  <div class="bubble bubble2">○</div>

  <div class="bubble bubble3">○</div>

</div>


<!-- CRAB RAVE -->

<iframe
  id="music"
  src="https://www.youtube.com/embed/LDU_Txk06tM?autoplay=1&loop=1&playlist=LDU_Txk06tM"
  allow="autoplay"
  title="Crab Rave">
</iframe>


<script>

let musicStarted = false;

function startCrabRave() {

  if (musicStarted) return;

  musicStarted = true;

  const music =
    document.getElementById("music");

  music.src =
    "https://www.youtube.com/embed/LDU_Txk06tM" +
    "?autoplay=1&loop=1&playlist=LDU_Txk06tM";
}

document.addEventListener(
  "click",
  startCrabRave,
  { once: true }
);

document.addEventListener(
  "touchstart",
  startCrabRave,
  { once: true }
);

</script>

</body>
</html>
